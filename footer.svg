    <line x1="1200" y1="130" x2="1030" y2="55"/>
    <line x1="1200" y1="130" x2="1080" y2="25"/>
    <path d="M 1155,110 Q 1162,94 1166,92"/>
    <path d="M 1108,90 Q 1122,66 1130,63"/>
